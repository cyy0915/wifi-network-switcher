version: 1

adapter:
  # Replace this with the InterfaceGuid of your Wi-Fi adapter.
  # Find it with: Get-NetAdapter | Format-Table Name, Status, InterfaceGuid
  interfaceGuid: "{00000000-0000-0000-0000-000000000001}"

defaults:
  ip:
    mode: dhcp
  dns:
    mode: dhcp

networks: {}

# To enable rules, replace "networks: {}" above with the example mapping below.
# Static-rule examples:
# networks:
#   "Office-WiFi":
#     ip:
#       mode: static
#       address: "192.168.10.20/24"
#       gateway: "192.168.10.1"
#     dns:
#       mode: static
#       servers:
#         - "192.168.10.2"
#         - "1.1.1.1"
#   "Hotel-WiFi":
#     dns:
#       mode: dhcp
#     # ip is inherited from defaults (DHCP).
