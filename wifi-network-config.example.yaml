version: 1

adapter:
  # install.ps1 normally creates wifi-network-config.yaml and fills this GUID
  # automatically. Only replace this value when creating a configuration
  # manually (for example, when the machine has multiple Wi-Fi adapters).
  # Find candidates with: Get-NetAdapter | Format-Table Name, Status, InterfaceGuid
  interfaceGuid: "{00000000-0000-0000-0000-000000000001}"

defaults:
  ip:
    mode: dhcp
  dns:
    mode: dhcp

networks: {}

# To enable rules, replace "networks: {}" above with the example mapping below.
# Static-rule examples:
# networks:
#   "Office-WiFi":
#     ip:
#       mode: static
#       address: "192.168.10.20/24"
#       gateway: "192.168.10.1"
#     dns:
#       # Static IPv4 requires static DNS; DHCP DNS is rejected.
#       mode: static
#       servers:
#         - "192.168.10.2"
#         - "1.1.1.1"
#   "Hotel-WiFi":
#     dns:
#       mode: dhcp
#     # ip is inherited from defaults (DHCP).
